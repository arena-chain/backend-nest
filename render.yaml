# Render Blueprint — https://render.com/docs/blueprint-spec
# After first deploy, set environment variables in the Render dashboard (secrets).
services:
  - type: web
    name: arena-chain-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
